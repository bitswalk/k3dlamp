name: Release

# Push a tag v<product.version> to build, test and publish a release whose
# assets back the one-line installer:
#   curl -fsSL https://github.com/bitswalk/k3dlamp/releases/latest/download/install.sh | bash
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches product.version
        run: |
          version="$(jq -r .product.version app-build-manifest.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match product.version $version"
            exit 1
          fi
      - name: Check the tag is annotated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Its message opens the release notes, which k3dlamp shows after an upgrade.
          type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" -q .object.type)"
          if [ "$type" != tag ]; then
            echo "::error::Tag $GITHUB_REF_NAME is not annotated; its message becomes the release notes"
            exit 1
          fi

  build-test:
    needs: check-version
    uses: ./.github/workflows/build-test.yml

  publish:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: k3dlamp-linux-x64
          path: dist

      - name: Stamp the installer and sum the assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/^RELEASE_VERSION=\"@VERSION@\"$/RELEASE_VERSION=\"$version\"/" install.sh >dist/install.sh
          grep -q "^RELEASE_VERSION=\"$version\"$" dist/install.sh
          cd dist
          rm SHA256SUMS
          sha256sum -- "k3dlamp-$version-linux-x64.tar.gz" install.sh >SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          headlamp_version="$(sed -n 's/^ARG HEADLAMP_VERSION=//p' build/headlamp.Dockerfile)"
          headlamp_commit="$(sed -n 's/^ARG HEADLAMP_COMMIT=//p' build/headlamp.Dockerfile)"
          # One row per shipped plugin: app-catalog-0.9.1 is App Catalog 0.9.1.
          plugin_rows="$(jq -r '.plugins[] | "\(.name) \(.archive)"' app-build-manifest.json |
            while read -r name url; do
              tag="$(basename "$(dirname "$url")")"
              title="$(sed -E 's/(^|-)([a-z])/ \u\2/g; s/^ //' <<<"$name")"
              echo "| $title | [${tag#"$name"-}](https://github.com/headlamp-k8s/plugins/releases/tag/$tag) |"
            done)"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" -q .object.sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" -q .message >notes.md
          # k3dlamp's post-upgrade notes stop at Headlamp's end-release-notes marker,
          # so the install steps stay on the release page.
          cat >>notes.md <<EOF

          | Component | Source |
          | --- | --- |
          | Headlamp | [$headlamp_version](https://github.com/kubernetes-sigs/headlamp/releases/tag/$headlamp_version), commit \`${headlamp_commit:0:12}\` |
          $plugin_rows
          | k3d plugin | Installed by users from [Artifact Hub](https://artifacthub.io/packages/headlamp/bitswalk-k3dlamp-k3d-plugin/k3dlamp-k3d-plugin) |
          | kind plugin | Installed by users from [Artifact Hub](https://artifacthub.io/packages/headlamp/bitswalk-k3dlamp-kind-plugin/k3dlamp-kind-plugin) |

          <!-- end-release-notes -->

          Install or upgrade for the current user:

          \`\`\`bash
          curl -fsSL https://github.com/bitswalk/k3dlamp/releases/download/$GITHUB_REF_NAME/install.sh | bash
          \`\`\`

          Then install the k3d plugin from **Plugin Catalog** in the sidebar, as the [README](https://github.com/bitswalk/k3dlamp#install) describes. Requires Linux x86_64, with Docker and k3d on \`PATH\` to create clusters.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
