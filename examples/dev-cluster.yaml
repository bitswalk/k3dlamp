# A throwaway cluster for trying the plugin on a workstation.
# It uses k3d's default bridge network, so it leaves the host's interfaces alone.
# Paste this file's absolute path into the plugin's "k3d config file" field.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dev                       # Headlamp shows it as k3d-dev
servers: 1
options:
  k3d:
    wait: true
    timeout: "300s"
  kubeconfig:
    updateDefaultKubeconfig: true # Headlamp picks the new context up from here
    switchCurrentContext: false
